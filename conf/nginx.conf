# The frontend uses paths relative to the current page (so they keep working
# under whatever sub-path this app is installed at); that only resolves
# correctly if the browser is at .../__PATH__/, so force the trailing slash.
location = __PATH__ {
  return 301 __PATH__/;
}

location __PATH__/ {
  # Large file transfers: raise the usual tiny upload limit and give
  # slow uploads/downloads enough time to complete.
  client_max_body_size 2G;
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;

  proxy_pass http://127.0.0.1:__PORT__/;

  # Always-private app: this forwards the SSOwat-authenticated username to
  # the backend as the `Ynh-User` / `X-Forwarded-User` headers, which is how
  # FileDrop scopes files to the logged-in user. See server.py current_user().
  include proxy_params_with_auth;
}
